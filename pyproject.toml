[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-agent"
version = "0.1.0"
description = "A Spec-Driven Behavioral Contract & Verification Engine for Tool-Using AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Stefano", email = "stefano@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "cel-python>=0.5.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[tool.pyrefly.errors]
redundant-cast = "warn"
implicit-any-parameter = "error"
no-any-return = "error"
unannotated-return = "error"
implicit-any = "error"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pyrefly>=1.3.0",
]

[project.scripts]
contract-agent = "contract_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyrefly]
python-version = "3.11.0"
preset = "legacy"
check-unannotated-defs = true
infer-return-types = "never"
project-includes = ["src"]
